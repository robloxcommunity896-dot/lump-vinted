<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lump → Vinted 2.0</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #17352b, transparent 35%),
        #0d1014;
    color: #fff;
}

.container {
    width: min(1050px, 94%);
    margin: auto;
    padding: 25px 0 60px;
}

header {
    text-align: center;
    padding: 25px 0 35px;
}

h1 {
    font-size: clamp(36px, 7vw, 65px);
    margin: 0;
}

h1 span {
    color: #00d084;
}

.subtitle {
    color: #8e959f;
    margin-top: 10px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.card {
    background: rgba(24, 28, 34, .94);
    border: 1px solid #292f38;
    border-radius: 20px;
    padding: 22px;
}

.card h2 {
    margin-top: 0;
}

label {
    display: block;
    color: #aeb4bd;
    font-size: 13px;
    margin: 15px 0 7px;
}

input,
select {
    width: 100%;
    padding: 13px;
    background: #0f1216;
    color: white;
    border: 1px solid #343b45;
    border-radius: 10px;
    font-size: 15px;
}

input:focus,
select:focus {
    outline: none;
    border-color: #00d084;
}

input[type="file"] {
    padding: 10px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 13px 17px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    width: 100%;
    margin-top: 20px;
    background: #00d084;
    color: #06130d;
    font-size: 16px;
}

.primary:hover {
    background: #00e894;
}

.secondary {
    background: #292f38;
    color: white;
}

.danger {
    background: #3a2023;
    color: #ff7d85;
}

.preview {
    width: 100%;
    height: 220px;
    object-fit: contain;
    background: #0b0e12;
    border-radius: 14px;
    margin-top: 12px;
    display: none;
}

.result {
    margin-top: 20px;
    padding: 18px;
    border-radius: 15px;
    background: #101419;
    display: none;
}

.big {
    font-size: 34px;
    font-weight: bold;
}

.green {
    color: #00d084;
}

.yellow {
    color: #ffc107;
}

.red {
    color: #ff5252;
}

.max-buy {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    background: #18251f;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 20px 0;
}

.stat {
    background: #181c22;
    border: 1px solid #292f38;
    border-radius: 15px;
    padding: 17px;
}

.stat-title {
    color: #858c96;
    font-size: 12px;
}

.stat-value {
    margin-top: 7px;
    font-size: 23px;
    font-weight: bold;
}

.items {
    margin-top: 20px;
}

.item {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    gap: 15px;
    align-items: center;
    background: #181c22;
    border: 1px solid #292f38;
    border-radius: 15px;
    padding: 12px;
    margin-bottom: 10px;
}

.item img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    background: #0c0f13;
}

.item-info h3 {
    margin: 0 0 5px;
}

.item-info p {
    margin: 3px 0;
    color: #9ba2ac;
    font-size: 13px;
}

.badge {
    display: inline-block;
    padding: 5px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: bold;
    margin-top: 5px;
}

.badge.green-bg {
    background: #123d2c;
    color: #00d084;
}

.badge.yellow-bg {
    background: #3d3212;
    color: #ffc107;
}

.badge.red-bg {
    background: #3d171a;
    color: #ff5252;
}

.empty {
    text-align: center;
    color: #656c75;
    padding: 35px 10px;
}

@media(max-width: 750px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .stats {
        grid-template-columns: 1fr;
    }

    .item {
        grid-template-columns: 70px 1fr;
    }

    .item img {
        width: 70px;
        height: 70px;
    }

    .item-actions {
        grid-column: 2;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>Lump <span>→</span> Vinted</h1>
    <div class="subtitle">
        Twój mały kalkulator resellingu 👕💰
    </div>
</header>


<div class="stats">

    <div class="stat">
        <div class="stat-title">WYDAŁEŚ</div>
        <div class="stat-value" id="totalSpent">0 zł</div>
    </div>

    <div class="stat">
        <div class="stat-title">POTENCJALNA SPRZEDAŻ</div>
        <div class="stat-value" id="totalSales">0 zł</div>
    </div>

    <div class="stat">
        <div class="stat-title">POTENCJALNY ZYSK</div>
        <div class="stat-value green" id="totalProfit">0 zł</div>
    </div>

</div>


<div class="grid">

    <div class="card">

        <h2>➕ Dodaj rzecz</h2>

        <label>Zdjęcie</label>
        <input
            type="file"
            id="photo"
            accept="image/*"
            onchange="previewImage()"
        >

        <img id="preview" class="preview">

        <label>Marka</label>
        <input
            id="brand"
            placeholder="np. Nike, Adidas, Levi's"
        >

        <label>Kategoria</label>
        <select id="category">
            <option>Koszulka</option>
            <option>Bluza</option>
            <option>Kurtka</option>
            <option>Spodnie</option>
            <option>Buty</option>
            <option>Sukienka</option>
            <option>Sweter</option>
            <option>Inne</option>
        </select>

        <label>Ilość rzeczy</label>
        <input type="number" id="quantity" value="1" min="1" step="1">

        <label>Cena zakupu w lumpie (zł) — za sztukę</label>
        <input
            type="number"
            id="buy"
            placeholder="np. 20"
            min="0"
            step="0.01"
        >

        <label>Przewidywana cena sprzedaży (zł)</label>
        <input
            type="number"
            id="sell"
            placeholder="np. 80"
            min="0"
            step="0.01"
        >

        <label>Inne koszty (zł)</label>
        <input
            type="number"
            id="costs"
            value="0"
            min="0"
            step="0.01"
        >

        <label>Minimalny zysk, jaki chcesz osiągnąć (zł)</label>
        <input
            type="number"
            id="desiredProfit"
            value="30"
            min="0"
            step="0.01"
        >

        <button class="primary" onclick="addItem()">
            🔥 DODAJ I SPRAWDŹ
        </button>

        <div class="result" id="result">

            <div>Ocena</div>

            <div class="big" id="decision"></div>

            <div id="profitResult"></div>

            <div class="max-buy">
                🎯 <b>Maksymalna cena zakupu:</b>
                <span id="maxBuy"></span> / szt.
            </div>

        </div>

    </div>


    <div class="card">

        <h2>📦 Twoje rzeczy</h2>

        <div id="items" class="items">
            <div class="empty">
                Jeszcze nic tutaj nie ma.<br>
                Dodaj pierwszą rzecz.
            </div>
        </div>

        <button class="danger" onclick="clearAll()">
            🗑️ Usuń wszystkie
        </button>

    </div>

</div>

</div>


<script>

let items = JSON.parse(localStorage.getItem("lumpItems") || "[]");

let currentPhoto = "";


/* =========================
   ZDJĘCIE
========================= */

function previewImage() {

    const file = document.getElementById("photo").files[0];
    const preview = document.getElementById("preview");

    if (!file) {
        currentPhoto = "";
        preview.style.display = "none";
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        currentPhoto = e.target.result;

        preview.src = currentPhoto;
        preview.style.display = "block";
    };

    reader.readAsDataURL(file);
}


/* =========================
   DODAWANIE
========================= */

function addItem() {

    const brand =
        document.getElementById("brand").value.trim();

    const category =
        document.getElementById("category").value;

    const quantity =
        Math.max(1, Math.floor(Number(document.getElementById("quantity").value) || 1));

    const buy =
        Number(document.getElementById("buy").value);

    const sell =
        Number(document.getElementById("sell").value);

    const costs =
        Number(document.getElementById("costs").value) || 0;

    const desiredProfit =
        Number(document.getElementById("desiredProfit").value) || 0;


    if (!buy || !sell) {

        alert("Wpisz cenę zakupu i cenę sprzedaży.");

        return;
    }


    const totalCost = (buy + costs) * quantity;

    const profitPerItem = sell - buy - costs;
    const profit = profitPerItem * quantity;

    const roi = (profitPerItem / (buy + costs)) * 100;


    /*
       Maksymalna cena zakupu,
       żeby osiągnąć wybrany zysk.
    */

    const maxBuy =
        sell - costs - desiredProfit;


    let decision;
    let decisionClass;

    if (profit >= 50) {

        decision = "🟢 BIERZ";
        decisionClass = "green";

    } else if (profit >= 20) {

        decision = "🟡 MOŻE BYĆ";
        decisionClass = "yellow";

    } else {

        decision = "🔴 ZOSTAW";
        decisionClass = "red";
    }


    document.getElementById("result").style.display = "block";

    document.getElementById("decision").textContent =
        decision;

    document.getElementById("decision").className =
        "big " + decisionClass;

    document.getElementById("profitResult").innerHTML =
        "Ilość: <b>" + quantity + " szt.</b><br>" +
        "Zysk łącznie: <b>" + profit.toFixed(2) + " zł</b><br>" +
        "Zysk / szt.: <b>" + profitPerItem.toFixed(2) + " zł</b><br>" +
        "ROI: <b>" +
        roi.toFixed(1) +
        "%</b>";


    document.getElementById("maxBuy").textContent =
        Math.max(0, maxBuy).toFixed(2) + " zł";


    const item = {

        id: Date.now(),

        brand:
            brand || "Bez marki",

        category,

        quantity,
        buy,

        sell,

        costs,

        profit,

        roi,

        photo:
            currentPhoto,

        decision,

        decisionClass
    };


    items.unshift(item);

    save();

    render();

    /*
       Czyścimy formularz,
       ale zostawiamy zdjęcie w podglądzie
       dopóki użytkownik nie wybierze następnego.
    */

    document.getElementById("brand").value = "";
    document.getElementById("quantity").value = "1";
    document.getElementById("buy").value = "";
    document.getElementById("sell").value = "";
    document.getElementById("costs").value = "0";

    document.getElementById("photo").value = "";

    currentPhoto = "";

    document.getElementById("preview").style.display = "none";
}


/* =========================
   WYŚWIETLANIE
========================= */

function render() {

    const container =
        document.getElementById("items");

    if (items.length === 0) {

        container.innerHTML = `
            <div class="empty">
                Jeszcze nic tutaj nie ma.<br>
                Dodaj pierwszą rzecz.
            </div>
        `;

        updateStats();

        return;
    }


    container.innerHTML = items.map(item => {

        let badgeClass = "red-bg";

        if (item.decisionClass === "green") {
            badgeClass = "green-bg";
        }

        if (item.decisionClass === "yellow") {
            badgeClass = "yellow-bg";
        }


        const image = item.photo
            ? `<img src="${item.photo}">`
            : `<img src="" alt="brak zdjęcia">`;


        return `

            <div class="item">

                ${image}

                <div class="item-info">

                    <h3>
                        ${escapeHtml(item.brand)}
                    </h3>

                    <p>
                        ${escapeHtml(item.category)}
                    </p>

                    <p>Ilość: <b>${item.quantity || 1} szt.</b></p>
                    <p>Zakup / szt.: <b>${item.buy.toFixed(2)} zł</b></p>
                    <p>Zakup łącznie: <b>${((item.buy + item.costs) * (item.quantity || 1)).toFixed(2)} zł</b></p>

                    <p>Sprzedaż / szt.: <b>${item.sell.toFixed(2)} zł</b></p>
                    <p>Sprzedaż łącznie: <b>${(item.sell * (item.quantity || 1)).toFixed(2)} zł</b></p>

                    <p>
                        Zysk:
                        <b class="green">
                            ${item.profit.toFixed(2)} zł
                        </b>
                    </p>

                    <span class="badge ${badgeClass}">
                        ${item.decision}
                    </span>

                </div>

                <div class="item-actions">

                    <button
                        class="danger"
                        onclick="deleteItem(${item.id})">
                        Usuń
                    </button>

                </div>

            </div>

        `;

    }).join("");


    updateStats();
}


/* =========================
   STATYSTYKI
========================= */

function updateStats() {

    let spent = 0;
    let sales = 0;
    let profit = 0;


    items.forEach(item => {

        const quantity = item.quantity || 1;
        spent += (item.buy + item.costs) * quantity;
        sales += item.sell * quantity;
        profit += item.profit;

    });


    document.getElementById("totalSpent")
        .textContent =
        spent.toFixed(2) + " zł";


    document.getElementById("totalSales")
        .textContent =
        sales.toFixed(2) + " zł";


    document.getElementById("totalProfit")
        .textContent =
        profit.toFixed(2) + " zł";
}


/* =========================
   USUWANIE
========================= */

function deleteItem(id) {

    items =
        items.filter(item => item.id !== id);

    save();

    render();
}


function clearAll() {

    if (!items.length) {
        return;
    }

    if (
        confirm(
            "Na pewno usunąć wszystkie rzeczy?"
        )
    ) {

        items = [];

        save();

        render();
    }
}


/* =========================
   ZAPIS
========================= */

function save() {

    localStorage.setItem(
        "lumpItems",
        JSON.stringify(items)
    );
}


/* =========================
   BEZPIECZNE TEKSTY
========================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* START */

render();

</script>

</body>
</html>
